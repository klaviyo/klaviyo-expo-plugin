name: CI

on:
  pull_request:

jobs:
  lint-and-type-check:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check
      run: npx tsc --noEmit
      
    - name: Check for linting issues
      run: |
        # Check for common issues
        echo "Checking for console.log statements..."
        if grep -r "console\.log" plugin/ --include="*.ts" --include="*.js"; then
          echo "Warning: console.log statements found in plugin code"
        fi
        
        echo "Checking for TODO comments..."
        if grep -r "TODO" plugin/ --include="*.ts" --include="*.js"; then
          echo "Warning: TODO comments found in plugin code"
        fi

  test:
    runs-on: ubuntu-22.04
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
  
    - name: Run tests with coverage
      run: npm run test:coverage

  test-peer-dependencies:
    runs-on: ubuntu-22.04
    
    strategy:
      matrix:
        # Real Expo SDK pairings from https://api.expo.dev/v2/versions/latest
        # (facebookReactNativeVersion / facebookReactVersion). Do not substitute
        # arbitrary versions: a combination Expo never shipped tests nothing a
        # customer can hit. The supported range is documented in README.md.
        include:
          # Expo SDK 52
          - react-version: "18.3.1"
            react-native-version: "0.76.9"
            expo-version: "~52.0.0"
          # Expo SDK 53
          - react-version: "19.0.0"
            react-native-version: "0.79.6"
            expo-version: "~53.0.0"
          # Expo SDK 54
          - react-version: "19.1.0"
            react-native-version: "0.81.5"
            expo-version: "~54.0.0"
          # Expo SDK 55
          - react-version: "19.2.0"
            react-native-version: "0.83.10"
            expo-version: "~55.0.0"
          # Expo SDK 56
          - react-version: "19.2.3"
            react-native-version: "0.85.3"
            expo-version: "~56.0.0"
          # Expo SDK 57
          - react-version: "19.2.3"
            react-native-version: "0.86.3"
            expo-version: "~57.0.0"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies with specific peer dependency versions
      # Deliberately NOT `npm ci` first, and deliberately --no-package-lock.
      # The committed lock pins the Expo 57 graph. Installing an older pairing on top
      # of it retains @expo/router-server@57, whose optional peer on
      # @expo/metro-runtime "^57.0.15" makes npm resolve that package fresh. It in
      # turn optionally peers react-dom "*", which resolves to latest, and that
      # react-dom requires a react the pairing does not have:
      #
      #   @expo/router-server@57.0.9 -> @expo/metro-runtime@57.0.15
      #     -> react-dom@19.3.0 -> peer react@^19.3.0   vs   react@18.3.1
      #
      # Note @expo/metro-runtime is never itself an entry in the lock; it is pulled in
      # only to satisfy that peer. Ignoring the lock drops the Expo 57 graph, so
      # nothing requires it or react-dom - which is what a real consumer on that SDK
      # gets. Lock integrity is still enforced by the lint-and-type-check, test, and
      # build jobs, which all use npm ci.
      run: |
        npm install --no-save --no-package-lock react@${{ matrix.react-version }} react-native@${{ matrix.react-native-version }} expo@${{ matrix.expo-version }}
        
    - name: Run tests with specific versions
      run: |
        echo "Testing with React ${{ matrix.react-version }}, React Native ${{ matrix.react-native-version }}, Expo ${{ matrix.expo-version }}"
        npm test
        
    - name: Build with specific versions
      run: |
        echo "Building with React ${{ matrix.react-version }}, React Native ${{ matrix.react-native-version }}, Expo ${{ matrix.expo-version }}"
        npm run build

  build:
    runs-on: ubuntu-22.04
    needs: [lint-and-type-check, test, test-peer-dependencies]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build

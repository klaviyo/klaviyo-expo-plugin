name: Publish SDK to NPM

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish (X.Y.Z or X.Y.Z-suffix)
        required: true
        type: string
      ref:
        description: Commit SHA to build and publish
        required: true
        type: string
      release_url:
        description: URL of the draft release this publish belongs to
        required: false
        type: string
        default: ''
      dry_run:
        description: Run npm publish --dry-run and skip the success alert
        required: false
        type: boolean
        default: false
      slack_ts:
        description: ts of the release's Slack message to update with the result. Empty posts a new message.
        required: false
        type: string
        default: ''

permissions: {}

env:
  PACKAGE_NAME: klaviyo-expo-plugin
  SLACK_USERNAME: Expo SDK
  SLACK_ICON_EMOJI: ':merlin-orb-expo:'

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ inputs.version }}
        run: |
          version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version to the npm dist-tag '$dist_tag'."
          if [ "$version" != "$package_version" ]; then
            echo "::error::Release tag $TAG_NAME does not match package.json version $package_version."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  publish-sdk:
    needs: test
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      already_published: ${{ steps.publish.outputs.already_published }}
      started: ${{ steps.started.outputs.started }}

    steps:
      - name: Mark job started
        id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare
        run: npm run prepare

      # Trusted publishing (OIDC): npm exchanges this job's OIDC token for
      # a short-lived credential, so there is no NPM_TOKEN secret to rotate.
      # Requires npm >= 11.21 and a trust relationship on npmjs.com allowing
      # `npm publish` from this workflow; provenance attestation is included.
      - name: Update npm for trusted publishing
        run: npm install -g "npm@^11.21.0"

      - name: Publish to npm (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run --tag "${{ needs.test.outputs.dist_tag }}"

      - name: Publish to npm
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.test.outputs.version }}
          DIST_TAG: ${{ needs.test.outputs.dist_tag }}
        run: |
          if npm publish --tag "$DIST_TAG"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          elif [ "$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::warning::${PACKAGE_NAME}@${VERSION} is already on npm; nothing to publish."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

  notify:
    needs: [test, publish-sdk]
    # Cancelled runs are reported by publish-release.yml's stopped job.
    if: >-
      always()
      && !contains(needs.*.result, 'cancelled')
      && !(inputs.dry_run && needs.publish-sdk.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Classify the result
        id: result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PUBLISH_RESULT: ${{ needs.publish-sdk.result }}
          PUBLISH_STARTED: ${{ needs.publish-sdk.outputs.started }}
          VERSION: ${{ needs.test.outputs.version || inputs.version }}
          DIST_TAG: ${{ needs.test.outputs.dist_tag }}
          ALREADY: ${{ needs.publish-sdk.outputs.already_published }}
        run: |
          if [ "$PUBLISH_RESULT" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            if [ "$ALREADY" = "true" ]; then
              echo "title=Expo plugin $VERSION already on npm, nothing published" >> "$GITHUB_OUTPUT"
            else
              echo "title=Expo plugin $VERSION published to npm${DIST_TAG:+ (dist-tag $DIST_TAG)}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$PUBLISH_RESULT" = "failure" ] && [ "$PUBLISH_STARTED" != "true" ]; then
            echo "status=stopped" >> "$GITHUB_OUTPUT"
            echo "title=Expo plugin $VERSION release stopped, npm deploy approval rejected or expired" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=Expo plugin $VERSION npm publish failed" >> "$GITHUB_OUTPUT"
            if [ "$TEST_RESULT" = "failure" ]; then
              echo "step=the test job (version check, type check or tests)" >> "$GITHUB_OUTPUT"
            else
              echo "step=npm publish" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack
        id: slack
        if: ${{ !(inputs.dry_run && steps.result.outputs.status == 'stopped') }}
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ inputs.slack_ts }}
          status: ${{ steps.result.outputs.status }}
          title: ${{ steps.result.outputs.title }}
          body: ${{ steps.result.outputs.status != 'success' && 'Nothing was published.' || '' }}
          fields: |
            Package: ${{ env.PACKAGE_NAME }}
            Version: ${{ needs.test.outputs.version || inputs.version }}
            Dist-tag: ${{ needs.test.outputs.dist_tag }}
            Commit: ${{ inputs.ref }}
            Requested by: ${{ github.actor }}
          links: |
            npm|https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ needs.test.outputs.version || inputs.version }}
            Release|${{ inputs.release_url }}

      - name: Reply with failure details
        if: steps.result.outputs.status == 'failure' && steps.slack.outputs.ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack.outputs.ts }}
          status: failure
          title: Failed at ${{ steps.result.outputs.step }}

  linear-release:
    needs: [test, publish-sdk]
    if: ${{ !inputs.dry_run && needs.publish-sdk.result == 'success' && !contains(inputs.version, '-') && github.event.release.prerelease != true }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync release to Linear
        id: linear-sync
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ needs.test.outputs.version }}
          name: ${{ needs.test.outputs.version }}

      - name: Complete release in Linear
        if: steps.linear-sync.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ needs.test.outputs.version }}

name: Promotion Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  promotion-check:
    name: Promotion check
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    concurrency:
      group: promotion-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Run promotion check
        uses: klaviyo/klaviyo-react-native-sdk/.github/shared/promotion-check@ecm/mage-1726/shared-ci
        with:
          bump-files: |
            package.json
            example/package.json
            ios/klaviyo-plugin-configuration.plist
            plugin/withKlaviyoAndroid.ts
            tests/withKlaviyoAndroid.internal.test.ts

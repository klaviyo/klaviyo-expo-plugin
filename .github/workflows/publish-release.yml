name: Publish release

# Entry point for every npm publish; the npm trusted publisher names this file.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z, or X.Y.Z-suffix for a prerelease)
        required: true
        type: string
      ref:
        description: Branch or commit to release (defaults to the default branch)
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run: run the checks, the approval and npm publish --dry-run; create and publish nothing'
        required: false
        default: false
        type: boolean
      skip_ci_check:
        description: Skip the CI-green check (the version, branch and tag checks still run)
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || (endsWith(github.triggering_actor || github.actor, '[bot]') && format('{0} (automation)', github.workflow) || github.triggering_actor || github.actor) }}
  VERSION: ${{ inputs.version || github.event.release.tag_name }}
  SLACK_USERNAME: Expo SDK
  SLACK_ICON_EMOJI: ':merlin-orb-expo:'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      checks: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      sha_short: ${{ steps.sha.outputs.short }}
      release_url: ${{ steps.draft.outputs.url }}
      slack_ts: ${{ steps.slack_pending.outputs.ts }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Require a commit on master or rel/*
        id: branch
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/rel/*:refs/remotes/origin/rel/*'
          if [ -z "$(git branch -r --contains HEAD --list 'origin/master' 'origin/rel/*')" ]; then
            echo "::error::$(git rev-parse HEAD) is not on master or a rel/* branch"
            exit 1
          fi

      - name: Resolve commit
        id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Validate version input
        id: validate
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-suffix, got '$VERSION'."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Check version stamps match
        id: stamps
        run: |
          fail=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error file=$1::$1 has version '$2', expected '$VERSION'. Run: node scripts/bump-version.js $VERSION"
              fail=1
            fi
          }
          check package.json "$(node -p "require('./package.json').version")"
          check example/package.json "$(node -p "require('./example/package.json').version")"
          check ios/klaviyo-plugin-configuration.plist "$(grep -A1 'klaviyo_sdk_plugin_version_override' ios/klaviyo-plugin-configuration.plist | sed -n 's:.*<string>\(.*\)</string>.*:\1:p')"
          check plugin/withKlaviyoAndroid.ts "$(sed -n "s/.*setStringResource('klaviyo_sdk_plugin_version_override', '\([^']*\)').*/\1/p" plugin/withKlaviyoAndroid.ts)"
          exit "$fail"

      - name: Check Klaviyo SDK pins
        id: pins
        run: ./scripts/ci/check-native-pins.sh

      - name: Skip the CI check
        id: skipci
        if: inputs.skip_ci_check
        run: echo "::warning::CI check skipped by request; pull_request CI for this commit was not verified."

      - name: Check CI is green on the commit
        id: ci
        if: ${{ !inputs.skip_ci_check }}
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          shas="$SHA"
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')"
          if [ -n "$pr_head" ]; then
            echo "Commit came from a PR; also checking its head commit $pr_head."
            shas="$shas $pr_head"
          fi
          runs=""
          for s in $shas; do
            skip_suites="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${s}" \
              --jq '.workflow_runs[] | select(.path | startswith(".github/workflows/publish-example") or startswith("dynamic/")) | .check_suite_id' | jq -s -c .)"
            runs+="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${s}/check-runs" \
              --jq '.check_runs[] | {name, status, conclusion, suite: .check_suite.id}' \
              | jq -r --argjson skip "$skip_suites" 'select((.name | IN("prepare", "stale") or startswith("publish-npm") or startswith("publish-release")) or (.suite | IN($skip[])) | not) | "\(.name)\t\(.status)\t\(.conclusion)"')"$'\n'
          done
          runs="$(sed '/^$/d' <<<"$runs")"
          if [ -z "$runs" ]; then
            echo "::error::No CI check runs found on $SHA or its PR."
            exit 1
          fi
          bad="$(awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped" && $3 != "neutral")' <<<"$runs")"
          if [ -n "$bad" ]; then
            echo "::error::CI is not green:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Summarize the dry run
        id: dryrun
        if: inputs.dry_run
        run: |
          {
            echo "### Release $VERSION (dry run)"
            echo "No draft release is created. Approve the \`npm\` deployment to run \`npm publish --dry-run\`; nothing is published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find or create the draft release
        id: draft
        if: ${{ !inputs.dry_run }}
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT_RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "url=$EVENT_RELEASE_URL" >> "$GITHUB_OUTPUT"
            echo "### Release $VERSION awaiting approval" >> "$GITHUB_STEP_SUMMARY"
            echo "Approve the \`npm\` deployment in this run to publish: $EVENT_RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing="$(gh release view "$VERSION" --json isDraft,url --jq '"\(.isDraft)\t\(.url)"' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            if [ "$(cut -f1 <<<"$existing")" != "true" ]; then
              echo "::error::Release $VERSION exists and is already published."
              exit 1
            fi
            url="$(cut -f2 <<<"$existing")"
            echo "Reusing existing draft release; notes left as written."
          else
            prerelease_flag=()
            if [[ "$VERSION" == *-* ]]; then prerelease_flag=(--prerelease --latest=false); fi
            url="$(gh release create "$VERSION" --draft "${prerelease_flag[@]}" --target "$SHA" --title "$VERSION" --generate-notes)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Release $VERSION awaiting approval" >> "$GITHUB_STEP_SUMMARY"
          echo "Review and edit the draft notes, then approve the \`npm\` deployment in this run: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Note the skipped CI check
        id: skipnote
        if: inputs.skip_ci_check
        run: echo "- ⚠️ **CI check skipped:** pull_request CI for this commit was not verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Slack action
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack release awaiting approval
        id: slack_pending
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: pending
          title: Expo plugin `${{ env.VERSION }}` awaiting approval${{ inputs.skip_ci_check && ' (CI check skipped)' || '' }}
          body: Review the draft release notes, then approve the `npm` deployment on this run.
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ steps.sha.outputs.short }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Release|${{ steps.draft.outputs.url }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.sha.outputs.sha }}

      - name: Find failed step
        id: failed
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          step=$(jq -r '
            {
              checkout: "Checkout repository",
              branch: "Require a commit on master or rel/*",
              sha: "Resolve commit",
              validate: "Validate version input",
              stamps: "Check version stamps match",
              pins: "Check Klaviyo SDK pins",
              skipci: "Skip the CI check",
              ci: "Check CI is green on the commit",
              dryrun: "Summarize the dry run",
              draft: "Find or create the draft release",
              skipnote: "Note the skipped CI check"
            } as $names
            | ([to_entries[] | select(.value.conclusion == "failure")][0].key) as $key
            | if $key == null then "unknown step" else ($names[$key] // $key) end
          ' <<<"$STEPS_JSON")
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Notify Slack release blocked
        id: slack_failure
        if: failure()
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ steps.slack_pending.outputs.ts }}
          status: failure
          title: Expo plugin `${{ env.VERSION }}` release blocked before approval
          body: A pre-publish check failed. Nothing was published.
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ steps.sha.outputs.short }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Release|${{ steps.draft.outputs.url }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.sha.outputs.sha }}

      - name: Reply with failure details
        if: failure() && steps.slack_failure.outputs.ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack_failure.outputs.ts }}
          status: failure
          title: Failed at ${{ steps.failed.outputs.step }}

  publish-npm:
    needs: prepare
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/publish-sdk.yml
    with:
      version: ${{ inputs.version || github.event.release.tag_name }}
      ref: ${{ needs.prepare.outputs.sha }}
      release_url: ${{ needs.prepare.outputs.release_url }}
      dry_run: ${{ inputs.dry_run == true }}
      slack_ts: ${{ needs.prepare.outputs.slack_ts }}
    secrets: inherit

  publish-release:
    needs: [prepare, publish-npm]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SLACK_TS: ${{ needs.prepare.outputs.slack_ts }}
    steps:
      - name: Publish the draft release
        id: release
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${VERSION}" \
            --jq "[.[] | select(.ref == \"refs/tags/${VERSION}\")][0].object // empty | \"\(.type) \(.sha)\"")"
          tagged=""
          if [ -n "$tag_ref" ]; then
            read -r tag_type tagged <<<"$tag_ref"
            if [ "$tag_type" = "tag" ]; then
              tagged="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tagged}" --jq .object.sha)"
            fi
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$SHA" ]; then
            echo "::error::Tag $VERSION now points at $tagged, not the released commit $SHA."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false --target "$SHA"
          else
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --target "$SHA"
          fi
          url="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "### Release $VERSION published"
            echo "- npm: https://www.npmjs.com/package/klaviyo-expo-plugin/v/$VERSION"
            echo "- Release: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the example app deploy
        id: example
        run: |
          # True when the workflow file at $VERSION declares the input named by $1.
          takes_input() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/publish-example.yml?ref=$VERSION" \
              -H "Accept: application/vnd.github.raw" | grep -q "^[[:space:]]*$1:"
          }
          args=()
          if [ -n "$SLACK_TS" ] && takes_input slack_thread_ts; then
            args+=(-f "slack_thread_ts=$SLACK_TS")
          fi
          if takes_input triggered_by; then
            args+=(-f "triggered_by=$TRIGGERED_BY")
          fi
          gh workflow run publish-example.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION" -f platform=both "${args[@]}"

      - name: Dispatch next release branch
        if: ${{ !cancelled() && steps.release.outcome == 'success' && !contains(env.VERSION, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rel-branch.yml --repo "$GITHUB_REPOSITORY" --ref master -f "base=$VERSION" -f "triggered_by=$TRIGGERED_BY"
          echo "Dispatched rel-branch.yml from $VERSION"

      - name: Checkout Slack action
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack release published
        if: success()
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ env.SLACK_TS }}
          status: success
          title: Expo plugin `${{ env.VERSION }}` published${{ contains(env.VERSION, '-') && ' (prerelease)' || '' }}
          body: On `npm`, GitHub release published, and the example app deploy dispatched at tag `${{ env.VERSION }}`.
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ needs.prepare.outputs.sha_short }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            npm|https://www.npmjs.com/package/klaviyo-expo-plugin/v/${{ env.VERSION }}
            Release|${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.VERSION }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}

      - name: Notify Slack release step failed
        id: slack_failure
        if: failure()
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ env.SLACK_TS }}
          status: failure
          title: Expo plugin `${{ env.VERSION }}` is on `npm` but ${{ steps.example.outcome == 'failure' && 'the example app deploy could not be dispatched' || 'the GitHub release could not be published' }}
          body: ${{ steps.example.outcome == 'failure' && 'Run `publish-example.yml` by hand on the tag.' || 'Publish the draft release by hand.' }}
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ needs.prepare.outputs.sha_short }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            npm|https://www.npmjs.com/package/klaviyo-expo-plugin/v/${{ env.VERSION }}
            Release|${{ needs.prepare.outputs.release_url }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}

      - name: Reply with failure details
        if: failure() && steps.slack_failure.outputs.ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack_failure.outputs.ts }}
          status: failure
          title: Failed at ${{ steps.example.outcome == 'failure' && 'Dispatch the example app deploy' || 'Publish the draft release' }}

  stopped:
    name: Report stopped release
    needs: [prepare, publish-npm, publish-release]
    if: always() && !inputs.dry_run && contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack release stopped
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ needs.prepare.outputs.slack_ts }}
          status: stopped
          title: Expo plugin `${{ env.VERSION }}` release stopped, run cancelled
          body: Check the run for what finished before it stopped.
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ needs.prepare.outputs.sha_short }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}

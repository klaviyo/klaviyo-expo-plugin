# Checks for the example app publish: the plugin's unit tests and type check,
# and the example app's type check.
# Builds and uploads nothing, and uses no secrets.
#
# Runs on pull requests that touch the publish files, and is called by
# publish-example.yml, whose deploy jobs wait for every job here.

name: Publish Example Checks

on:
  pull_request:
    paths:
      - ".github/workflows/publish-example*.yml"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "scripts/ci/**"
      - "example/**"
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin type check and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  example:
    name: Example app type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Type check
        working-directory: example
        run: npx tsc --noEmit

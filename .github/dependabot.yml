# Baseline rules: SDK Dependabot Bot project, see the rules page.
version: 2
updates:
- package-ecosystem: npm
  directories:
  - '/'
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  commit-message:
    prefix: chore
    include: scope
  groups:
    npm-tooling-minor-patch:
      applies-to: version-updates
      patterns:
      - '*'
      exclude-patterns:
      - klaviyo-react-native-sdk
      update-types:
      - minor
      - patch
    npm-tooling-security:
      applies-to: security-updates
      patterns:
      - '*'
      exclude-patterns:
      - klaviyo-react-native-sdk
  ignore:
  - dependency-name: klaviyo-react-native-sdk
  # Held until the plugin moves to the next Expo SDK. These move together in an
  # Expo SDK upgrade. Remove them in that change.
  - dependency-name: expo
    update-types:
    - version-update:semver-major
  - dependency-name: 'expo-*'
    update-types:
    - version-update:semver-major
  - dependency-name: '@expo/*'
    update-types:
    - version-update:semver-major
  - dependency-name: react
    update-types:
    - version-update:semver-major
  - dependency-name: react-native
    update-types:
    - version-update:semver-major
  - dependency-name: '@react-native/*'
    update-types:
    - version-update:semver-major
# Example app is security-only: open-pull-requests-limit 0 turns off version
# updates but keeps security updates. The example is pinned to its Expo SDK and
# moves by hand when the plugin supports a new one.
- package-ecosystem: npm
  directories:
  - '/example'
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
  commit-message:
    prefix: chore
    include: scope
  groups:
    npm-example-security:
      applies-to: security-updates
      patterns:
      - '*'
      exclude-patterns:
      - klaviyo-react-native-sdk
  ignore:
  - dependency-name: klaviyo-react-native-sdk
- package-ecosystem: github-actions
  directories:
  - '/'
  - '/.github/actions/*'
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  commit-message:
    prefix: chore
    include: scope
  groups:
    actions-minor-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    actions-security:
      applies-to: security-updates
      patterns:
      - '*'

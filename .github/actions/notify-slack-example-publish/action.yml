name: Notify Slack of example app publish result
description: Posts a Slack message summarizing an EAS build + submit job (success or failure) for the Expo plugin example app.
inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  result:
    description: "'success' or 'failure' — drives icon and headline"
    required: true
  platform:
    description: "Human-readable platform label (e.g. 'Play Store', 'TestFlight')"
    required: true
  version_label:
    description: Version string to show in the message (e.g. 'X.Y.Z (build)')
    required: false
    default: "?"
  build_url:
    description: EAS dashboard page for the build. Only viewable by members of the Expo account that owns the project.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Install access goes through the store testing programs (Play internal
    # testing / TestFlight), which only admit testers added in the consoles.
    # No direct binary or EAS internal-distribution link is posted: this repo
    # is public and those links are not confirmed to require sign-in.
    - uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.result == 'success' && '✅' || '🚨' }} Expo Plugin Example App: ${{ inputs.platform }} ${{ inputs.result == 'success' && 'publish succeeded' || 'publish failed' }}"
          blocks:
            - type: "header"
              text:
                type: "plain_text"
                text: "${{ inputs.result == 'success' && '✅' || '🚨' }} Expo Plugin Example App: ${{ inputs.platform }} ${{ inputs.result == 'success' && 'publish succeeded' || 'publish failed' }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Repository:* ${{ github.repository }}\n*Workflow:* ${{ github.workflow }}\n*Ref:* `${{ github.ref_name }}`\n*Version:* `${{ inputs.version_label }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}${{ inputs.result == 'success' && format('\n*Install:* {0} (testers added in the store console only)', inputs.platform == 'TestFlight' && 'TestFlight app' || 'Play Store internal testing') || '' }}${{ inputs.build_url != '' && format('\n*EAS build:* <{0}|View on expo.dev> (Expo account members only)', inputs.build_url) || '' }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"

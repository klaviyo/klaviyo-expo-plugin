name: Notify Slack of example app publish result
description: Posts the deploy result for the Expo example app. A failed deploy posts one failure message; a failure to set the store notes posts a separate warning.
inputs:
  webhook:
    description: Slack incoming webhook URL. When empty, nothing is posted.
    required: false
    default: ''

  result:
    description: "'success', 'failure' or 'notes-failure'"
    required: true
  platform:
    description: "'iOS' or 'Android'"
    required: true
  destination:
    description: "'TestFlight' or 'Play internal'"
    required: true
  build:
    description: Full app version and build number, e.g. '1.0.0 (7)'
    required: false
    default: '—'
  sdks:
    description: Short SDK names and versions, e.g. 'Expo 1.0.0 · main@abc1234 | RN 2.5.0 | iOS 5.4.0'
    required: false
    default: '—'
  source:
    description: Sanitized source label and event, e.g. 'main (push)'
    required: true
  commit_sha:
    description: Full commit SHA that was built
    required: true
  failed_step:
    description: Name of the step that failed, for a failure message
    required: false
    default: ''
  get_build:
    description: Slack mrkdwn telling testers how to install the build. Must not contain public or unauthenticated links, since this repo's logs are public.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check for a webhook
      id: webhook
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
      run: |
        if [ -z "$WEBHOOK" ]; then
          echo "::notice::SLACK_WEBHOOK_URL is not set; skipping the Slack message."
          echo "post=false" >> "$GITHUB_OUTPUT"
        else
          echo "post=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Slack payload
      id: payload
      if: steps.webhook.outputs.post == 'true'
      continue-on-error: true
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        PLATFORM: ${{ inputs.platform }}
        DESTINATION: ${{ inputs.destination }}
        BUILD: ${{ inputs.build }}
        SDKS: ${{ inputs.sdks }}
        SOURCE: ${{ inputs.source }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        FAILED_STEP: ${{ inputs.failed_step }}
        GET_BUILD: ${{ inputs.get_build }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        file="${RUNNER_TEMP}/slack-payload.json"
        "${GITHUB_WORKSPACE}/scripts/ci/slack-payload.sh" "$file"
        echo "file=$file" >> "$GITHUB_OUTPUT"

    - if: steps.webhook.outputs.post == 'true' && steps.payload.outcome == 'success'
      continue-on-error: true
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ steps.payload.outputs.file }}

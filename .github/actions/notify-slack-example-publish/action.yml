name: Notify Slack of example app publish result
description: Posts the deploy result for the Expo example app. A failed deploy posts one failure message; a failure to set the store notes posts a separate warning.
inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  result:
    description: "'success', 'failure' or 'notes-failure'"
    required: true
  platform:
    description: "'iOS' or 'Android'"
    required: true
  destination:
    description: "'TestFlight' or 'Play internal'"
    required: true
  build:
    description: Full app version and build number, e.g. '1.0.0 (7)'
    required: false
    default: '—'
  sdks:
    description: Short SDK names and versions, e.g. 'Expo 1.0.0 · main@abc1234 | RN 2.5.0 | iOS 5.4.0'
    required: false
    default: '—'
  source:
    description: Sanitized source label and event, e.g. 'main (push)'
    required: true
  commit_sha:
    description: Full commit SHA that was built
    required: true
  failed_step:
    description: Name of the step that failed, for a failure message
    required: false
    default: ''
  get_build:
    description: Slack mrkdwn telling testers how to install the build. Must not contain public or unauthenticated links, since this repo's logs are public.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.result == 'success' && '✅' || inputs.result == 'failure' && '❌' || '⚠️' }} Expo Example (${{ inputs.platform }}) ${{ inputs.result == 'success' && format('→ {0}', inputs.destination) || inputs.result == 'failure' && format('deploy failed at {0}', inputs.failed_step || 'an unknown step') || format('build {0} uploaded to {1}, but its release notes were not set', inputs.build, inputs.destination) }}"
          blocks:
            - type: "section"
              text:
                type: "mrkdwn"
                text: "${{ inputs.result == 'success' && '✅' || inputs.result == 'failure' && '❌' || '⚠️' }} *Expo Example (${{ inputs.platform }})* ${{ inputs.result == 'success' && format('→ {0}', inputs.destination) || inputs.result == 'failure' && format('deploy failed at {0}', inputs.failed_step || 'an unknown step') || format('build uploaded to {0}, but its release notes were not set. Re-run the failed job or set them by hand in the store console.', inputs.destination) }}\n*Build:* ${{ inputs.build }}${{ inputs.result != 'failure' && format('\n*SDKs:* {0}', inputs.sdks) || '' }}\n*Source:* ${{ inputs.source }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.commit_sha }}|${{ substr(inputs.commit_sha, 0, 7) }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|CI run>${{ inputs.result == 'success' && inputs.get_build != '' && format('\n*Get the build:* {0}', inputs.get_build) || '' }}"

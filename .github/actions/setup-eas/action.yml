name: Set up EAS for the example app
description: Installs Node, the plugin and example app dependencies, and EAS CLI.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          example/package-lock.json

    - name: Install plugin dependencies
      shell: bash
      run: npm ci

    - name: Install example dependencies
      shell: bash
      working-directory: example
      run: npm ci

    - name: Setup EAS CLI
      uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
      with:
        eas-version: 24.x
        packager: npm

name: Notify Slack of SDK publish result
description: Posts a Slack message summarizing an npm publish of the Expo plugin (success or failure).
inputs:
  webhook:
    description: Slack incoming webhook URL. When empty, nothing is posted.
    required: false
    default: ''
  result:
    description: "'success', 'failure' or 'stopped' (approval rejected); drives the icon and headline"
    required: true
  package:
    description: npm package name
    required: true
  version:
    description: Version that was published (or attempted)
    required: false
    default: unknown
  release_url:
    description: URL of the GitHub release that triggered the publish
    required: false
    default: ''
  commit:
    description: Commit SHA that was built and published
    required: false
    default: ''
  dist_tag:
    description: npm dist-tag the version was published to
    required: false
    default: ''
  already_published:
    description: "'true' when the version was already on npm and nothing was published"
    required: false
    default: ''
  reason:
    description: Why the publish stopped (result 'stopped' only)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check for a webhook
      id: webhook
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
      run: |
        if [ -z "$WEBHOOK" ]; then
          echo "::notice::SLACK_WEBHOOK_URL is not set; skipping the Slack message."
          echo "post=false" >> "$GITHUB_OUTPUT"
        else
          echo "post=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Compose the headline
      if: steps.webhook.outputs.post == 'true'
      id: headline
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        DIST_TAG: ${{ inputs.dist_tag }}
        ALREADY: ${{ inputs.already_published }}
        REASON: ${{ inputs.reason }}
      run: |
        case "$RESULT" in
          success)
            if [ "$ALREADY" = "true" ]; then
              headline="✅ Expo plugin: already on npm, nothing published"
            else
              headline="✅ Expo plugin: npm publish succeeded${DIST_TAG:+ (dist-tag $DIST_TAG)}"
            fi
            ;;
          stopped) headline="⚠️ Expo plugin: release stopped (${REASON:-stopped}), nothing published" ;;
          *) headline="🚨 Expo plugin: npm publish failed" ;;
        esac
        echo "text=$headline" >> "$GITHUB_OUTPUT"

    - if: steps.webhook.outputs.post == 'true'
      continue-on-error: true
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ steps.headline.outputs.text }} (${{ inputs.package }}@${{ inputs.version }})"
          blocks:
            - type: "header"
              text:
                type: "plain_text"
                text: "${{ steps.headline.outputs.text }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Package:* <https://www.npmjs.com/package/${{ inputs.package }}/v/${{ inputs.version }}|${{ inputs.package }}>\n*Version:* `${{ inputs.version }}`\n*Commit:* `${{ inputs.commit || github.sha }}`\n*Author:* ${{ github.actor }}${{ inputs.release_url != '' && format('\n*Release:* <{0}|View release>', inputs.release_url) || '' }}"
            - type: "section"
              text:
                type: "mrkdwn"
                text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
